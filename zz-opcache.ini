; Disable the opcache JIT.
;
; The image ships /usr/local/etc/php/conf.d/opcache-recommended.ini with
; opcache.jit=1255 and opcache.jit_buffer_size=8M. On 2026-08-05 that combination
; segfaulted every php-fpm worker on PHP 8.5.9/aarch64: a bad trace compiled into
; the *shared* JIT buffer, so respawned workers kept crashing (SIGSEGV on a wild
; pointer inside php-fpm itself) until the container was restarted. Nextcloud is
; I/O- and DB-bound, so JIT buys us essentially nothing here.
;
; The filename must sort AFTER opcache-recommended.ini -- conf.d is loaded in
; alphabetical order, which is why nextcloud.ini ("n" < "o") cannot override this.
opcache.jit=disable
opcache.jit_buffer_size=0
